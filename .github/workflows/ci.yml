name: CI

# Corre em cada pull request e em cada push para a main: testes da API, e na webapp lint (sem erros), testes e build.
# Para impedir o merge de PRs com falhas, ativar em GitHub > Settings > Branches > main > "Require status checks" (server, webapp).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      # Dependências de produção com falhas conhecidas: informativo (o passo fica com aviso mas não faz falhar o CI)
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  webapp:
    name: webapp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Mais memória para o build: o pacote é grande (editor, PDF, gráficos) e o limite por omissão do Node, nos servidores do GitHub, não chega
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
