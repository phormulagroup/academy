<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Bial Regional Academy</title>
    <link rel="icon" type="image/png" href="/FAVICON.png" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 24px; text-align: center; font-family: Poppins, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #163986; background: #fff; }
      img { width: 100%; max-width: 260px; height: auto; }
      h1 { margin: 0; font-size: 1.6rem; }
      p { margin: 12px auto 0; max-width: 460px; line-height: 1.5; opacity: 0.8; }
      button { font: inherit; font-weight: 600; color: #fff; background: #00b9d6; border: 1px solid #00b9d6; border-radius: 6px; padding: 12px 28px; cursor: pointer; transition: all 0.2s; }
      button:hover { background: #fff; color: #00b9d6; }
      small { opacity: 0.6; }
    </style>
  </head>
  <body>
    <img src="/maintenance/logo.png" alt="Bial Regional Academy" />
    <div>
      <h1 id="title">We're having server problems</h1>
      <p id="text">The service may be temporarily unavailable or under maintenance. We'll keep trying automatically.</p>
    </div>
    <button id="retry" type="button">Try again</button>
    <small id="status"></small>

    <script>
      // Página estática, sem dependências: serve para quando o servidor web devolve erro e a app React não consegue arrancar
      var TEXTS = {
        pt: ["Estamos com problemas no servidor", "O serviço pode estar temporariamente indisponível ou em manutenção. Voltamos a tentar automaticamente.", "Tentar novamente", "A tentar novamente em "],
        en: ["We're having server problems", "The service may be temporarily unavailable or under maintenance. We'll keep trying automatically.", "Try again", "Trying again in "],
        es: ["Estamos teniendo problemas con el servidor", "El servicio puede no estar disponible temporalmente o estar en mantenimiento. Lo volveremos a intentar automáticamente.", "Intentar de nuevo", "Reintentando en "],
        fr: ["Nous rencontrons des problèmes de serveur", "Le service est peut-être temporairement indisponible ou en maintenance. Nous réessayons automatiquement.", "Réessayer", "Nouvelle tentative dans "]
      };
      var fromUrl = location.pathname.split("/")[1];
      var fromBrowser = (navigator.language || "en").slice(0, 2);
      var t = TEXTS[fromUrl] || TEXTS[fromBrowser] || TEXTS.en;
      document.documentElement.lang = TEXTS[fromUrl] ? fromUrl : TEXTS[fromBrowser] ? fromBrowser : "en";
      document.getElementById("title").textContent = t[0];
      document.getElementById("text").textContent = t[1];
      document.getElementById("retry").textContent = t[2];

      var left = 20;
      var status = document.getElementById("status");
      function tick() {
        status.textContent = t[3] + left + "s";
        if (left-- <= 0) location.reload();
      }
      tick();
      setInterval(tick, 1000);
      document.getElementById("retry").onclick = function () { location.reload(); };
    </script>
  </body>
</html>
