<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex" />
		<title>Bial Regional Academy</title>
		<link rel="icon" type="image/png" href="/FAVICON.png" />
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 24px;
				padding: 24px;
				text-align: center;
				font-family:
					Poppins,
					system-ui,
					-apple-system,
					"Segoe UI",
					Roboto,
					sans-serif;
				color: #163986;
				background: #fff;
			}
			img {
				width: 100%;
				max-width: 260px;
				height: auto;
			}
			h1 {
				margin: 0;
				font-size: 1.6rem;
			}
			p {
				margin: 12px auto 0;
				max-width: 460px;
				line-height: 1.5;
				opacity: 0.8;
			}
			button {
				font: inherit;
				font-weight: 600;
				color: #fff;
				background: #00b9d6;
				border: 1px solid #00b9d6;
				border-radius: 6px;
				padding: 12px 28px;
				cursor: pointer;
				transition: all 0.2s;
			}
			button:hover {
				background: #fff;
				color: #00b9d6;
			}
			small {
				opacity: 0.6;
			}
		</style>
	</head>
	<body>
		<img src="/maintenance/logo.png" alt="Bial Regional Academy" />
		<div>
			<h1 id="title">We're having server problems</h1>
			<p id="text">The service may be temporarily unavailable or under maintenance. We'll keep trying automatically.</p>
		</div>
		<button id="retry" type="button">Try again</button>
		<small id="status"></small>

		<script src="/maintenance/page.js"></script>
	</body>
</html>
